# Local development and test database. The credentials are for local use only.
name: atlas

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces TCP, so this stays unhealthy during the image's init step.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U atlas -d atlas_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
