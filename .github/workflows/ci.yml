name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      TEST_DATABASE_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_test

    steps:
      - uses: actions/checkout@v7

      # Reads the version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      # Reads the version from engines.node in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Browser checks rebuild/seed atlas_test; always run after API tests.
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - run: pnpm test:web:browser
